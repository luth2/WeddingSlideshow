<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wedding Slideshow</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="page-shell">
      <section class="upload-panel" aria-labelledby="page-title">
        <h1 id="page-title" data-slideshow-title></h1>
        <p class="intro">Share your favorite photos from this special day with us.</p>

        <div class="divider" aria-hidden="true"></div>

        <form id="upload-form" class="upload-form">
          <label id="drop-zone" class="drop-zone" for="photo-input">
            <span class="drop-title">Choose photos</span>
            <span class="drop-copy">JPG, PNG, GIF, WebP or HEIC</span>
            <span id="file-count" class="file-count">No photos selected</span>
          </label>
          <input id="photo-input" name="photos" type="file" accept="image/*,.heic,.heif" multiple>

          <ul id="file-list" class="file-list" aria-live="polite"></ul>

          <button id="upload-button" class="primary-button" type="submit">Upload</button>
          <p id="status-message" class="status-message" role="status" aria-live="polite"></p>
        </form>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
