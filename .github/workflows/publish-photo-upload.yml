name: Publish photo upload image

on:
  workflow_call:
    inputs:
      version:
        description: Semantic version to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: publish-photo-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository_owner }}/wedding-photo-upload
        tags: |
          type=raw,value=latest
          type=sha,prefix=sha-
          type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
          type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.description=Photo upload service for Wedding Slideshow
          org.opencontainers.image.licenses=GPL-3.0-only
          org.opencontainers.image.authors=https://github.com/luth2

    - name: Build and push image
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ./Fotoupload_page
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        provenance: false
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Generate and submit SBOM
      uses: anchore/sbom-action@v0
      with:
        image: ghcr.io/${{ github.repository_owner }}/wedding-photo-upload@${{ steps.build.outputs.digest }}
        format: spdx-json
        output-file: wedding-photo-upload.spdx.json
        artifact-name: wedding-photo-upload-sbom.spdx.json
        dependency-snapshot: true
        registry-username: ${{ github.actor }}
        registry-password: ${{ secrets.GITHUB_TOKEN }}
        github-token: ${{ secrets.GITHUB_TOKEN }}