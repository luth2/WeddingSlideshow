name: Publish photo upload image

on:
  push:
    branches:
    - main
    paths:
    - Fotoupload_page/**
    - .github/workflows/publish-photo-upload.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-photo-upload-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Generate image metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository_owner }}/wedding-photo-upload
        tags: |
          type=raw,value=latest,enable={{is_default_branch}}
          type=sha,prefix=sha-
        labels: |
          org.opencontainers.image.source=https://github.com/${{ github.repository }}
          org.opencontainers.image.description=Photo upload service for Wedding Slideshow
          org.opencontainers.image.licenses=GPL-3.0-only
          org.opencontainers.image.authors=https://github.com/luth2

    - name: Build and push image
      uses: docker/build-push-action@v6
      with:
        context: ./Fotoupload_page
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max