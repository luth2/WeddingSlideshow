name: Validate Helm chart

on:
  push:
    branches:
    - main
    paths:
    - WeddingSlideshow/**
    - .github/workflows/publish-helm-chart.yml
  pull_request:
    paths:
    - WeddingSlideshow/**
    - .github/workflows/publish-helm-chart.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v7

    - name: Set up Helm
      uses: azure/setup-helm@v5

    - name: Lint chart
      run: helm lint ./WeddingSlideshow

    - name: Render chart
      run: helm template wedding-slideshow ./WeddingSlideshow --namespace wedding-photos > /dev/null