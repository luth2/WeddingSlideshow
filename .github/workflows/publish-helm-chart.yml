name: Publish Helm chart

on:
  push:
    branches:
    - main
    paths:
    - WeddingSlideshow/**
    - docs/**
    - .github/workflows/publish-helm-chart.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  lint-and-package:
    runs-on: ubuntu-latest
    steps:
    - name: Check out repository
      uses: actions/checkout@v4

    - name: Set up Helm
      uses: azure/setup-helm@v4

    - name: Lint chart
      run: helm lint ./WeddingSlideshow

    - name: Render chart
      run: helm template wedding-slideshow ./WeddingSlideshow --namespace wedding-photos > /dev/null

    - name: Package chart repository
      run: |
        mkdir -p _site
        helm package ./WeddingSlideshow --destination _site
        helm repo index _site --url https://luth2.github.io/WeddingSlideshow
        cp docs/index.html docs/styles.css README.md _site/

    - name: Configure GitHub Pages
      uses: actions/configure-pages@v5

    - name: Upload Pages artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: lint-and-package
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4