    interval: weekly
  open-pull-requests-limit: 10

- package-ecosystem: npm
  directory: /Web_Slideshow
  schedule:
    interval: weekly
  open-pull-requests-limit: 10

- package-ecosystem: docker
  directory: /Fotoupload_page
  schedule:
    interval: weekly
