- package-ecosystem: docker
  directory: /Web_Slideshow
  schedule:
    interval: weekly
  open-pull-requests-limit: 5

- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
  open-pull-requests-limit: 10